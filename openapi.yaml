
openapi: 3.1.0
info:
title: Decision Intelligence Layer — Core
version: 1.2.0
description: >
Decision Intelligence Framework v1.2, Core Specification. Matches
api/main.py and api/schemas.py exactly — this file is generated by
hand from the same source of truth, not by FastAPI's auto-export, so
diff it against `python -c "import json,api.main; print(json.dumps(api.main.app.openapi()))"`
after any route change.
servers:

- url: http://localhost:8000
paths:
/v1/metrics:
post:
operationId: UpdateMetric
summary: Propose/commit a metric (write side, idempotent on idempotency_key)
requestBody:
required: true
content:
application/json:
schema:
$ref: '#/components/schemas/UpdateMetricRequest'
responses:
'202':
description: Accepted — ACCEPTED or DUPLICATE_IGNORED (I6)
content:
application/json:
schema:
$ref: '#/components/schemas/UpdateMetricResponseBody'
'422':
description: evidence_refs empty — rejected per invariant I3
content:
application/json:
schema:
$ref: '#/components/schemas/ErrorResponse'

/v1/scoreboard/{decision_id}:
get:
operationId: GetScoreboard
summary: Read-only CQRS projection of current decision state
parameters:
- name: decision_id
in: path
required: true
schema: {type: string}
responses:
'200':
description: OK
content:
application/json:
schema:
$ref: '#/components/schemas/GetScoreboardResponse'
'404':
description: decision_id not found
content:
application/json:
schema:
$ref: '#/components/schemas/ErrorResponse'

/v1/merkle-proof:
get:
operationId: GetMerkleProof
summary: Offline-verifiable Merkle inclusion proof for one committed metric (I9)
parameters:
- name: decision_id
in: query
required: true
schema: {type: string}
- name: metric_name
in: query
required: true
schema: {type: string}
responses:
'200':
description: OK
content:
application/json:
schema:
$ref: '#/components/schemas/GetMerkleProofResponse'
'404':
description: metric not committed, or committed but not yet anchored
content:
application/json:
schema:
$ref: '#/components/schemas/ErrorResponse'

/healthz:
get:
operationId: HealthCheck
responses:
'200':
description: OK

components:
schemas:
UpdateMetricRequest:
type: object
required: [decision_id, metric_name, value, idempotency_key, evidence_refs, proposed_by]
properties:
decision_id: {type: string}
metric_name: {type: string}
value: {}
idempotency_key: {type: string, minLength: 16}
evidence_refs:
type: array
items: {type: string}
minItems: 1
proposed_by: {type: string}

```
UpdateMetricResponseBody:
  type: object
  required: [status]
  properties:
    status: {type: string, enum: [ACCEPTED, DUPLICATE_IGNORED]}

ScoreboardMetricOut:
  type: object
  properties:
    value: {}
    evidence_refs:
      type: array
      items: {type: string}
    committed_at: {type: string, format: date-time}

GetScoreboardResponse:
  type: object
  required: [decision_id, trust_score, metrics, rebuilt_at]
  properties:
    decision_id: {type: string}
    trust_score:
      oneOf:
        - type: number
          minimum: 0
          maximum: 1
        - type: string
          enum: [INSUFFICIENT_DATA]
      description: "I4 — never a fabricated number when required metrics are missing"
    metrics:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ScoreboardMetricOut'
    merkle_root_ref: {type: string, nullable: true}
    rebuilt_at: {type: string, format: date-time}

ProofNodeOut:
  type: object
  properties:
    hash: {type: string}
    position: {type: string, enum: [LEFT, RIGHT]}

GetMerkleProofResponse:
  type: object
  required: [leaf_hash, proof_path, root, anchor_signature, anchor_timestamp]
  properties:
    leaf_hash: {type: string}
    proof_path:
      type: array
      items:
        $ref: '#/components/schemas/ProofNodeOut'
    root: {type: string}
    anchor_signature: {type: string, description: "Ed25519, hex"}
    anchor_timestamp: {type: string, format: date-time}

ErrorResponse:
  type: object
  properties:
    detail: {type: string}
```




#Makefile

.PHONY: install install-dev proto run-api run-grpc test test-unit test-integration verify-core lint fmt typecheck docker-up docker-down docker-logs clean

install:
pip install -r requirements.txt

install-dev:
pip install -r requirements-dev.txt

## Regenerates grpc/core_pb2.py and grpc/core_pb2_grpc.py from grpc/core.proto.

## Not committed to the repo on purpose (generated code drifting from a

## checked-in .proto is a classic source of silent bugs) — run this after

## installing requirements, before running core-grpc locally without Docker.

proto:
python -m grpc_tools.protoc -I grpc --python_out=grpc --grpc_python_out=grpc grpc/core.proto

run-api:
CORE_ENV=local uvicorn api.main:app --reload --port 8000

run-grpc:
CORE_ENV=local python -m grpc.server

## Runs the same executable, dependency-light proof used to validate this

## repo before pydantic/fastapi/etc were available to test against — safe

## to run with just stdlib + cryptography installed.

verify-core:
python3 tests/verify_core_logic_stdlib.py

test: test-unit test-integration

test-unit:
pytest tests/unit -v

test-integration:
pytest tests/integration -v

lint:
ruff check .

fmt:
black .
ruff check --fix .

typecheck:
mypy domain application interfaces infrastructure api

docker-up:
docker-compose up --build

docker-down:
docker-compose down -v

docker-logs:
docker-compose logs -f core-api core-grpc

clean:
find . -name "**pycache**" -type d -exec rm -rf {} + 2>/dev/null || true
find . -name "*.pyc" -delete




#Dockerfile

# syntax=docker/dockerfile:1

FROM python:3.11-slim AS base

WORKDIR /srv

# System deps for asyncpg / cryptography build backends

RUN apt-get update && apt-get install -y --no-install-recommends \
build-essential \
&& rm -rf /var/lib/apt/lists/*

COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY . .

# Generate gRPC stubs at build time (not committed — see grpc/server.py

# docstring for why: keeps generated code from silently drifting from

# core.proto). Requires grpcio-tools, already in requirements.txt.

RUN python -m grpc_tools.protoc \
-I grpc \
--python_out=grpc \
--grpc_python_out=grpc \
grpc/core.proto

ENV CORE_ENV=docker \
PYTHONUNBUFFERED=1 \
PYTHONPATH=/srv

EXPOSE 8000 50051

# Two processes (REST + gRPC) in one image for simplicity; docker-compose.yml

# runs them as two separate containers from this same image via `command:`

# overrides, which is the actual recommended way to run this in practice.

CMD ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]




